<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Admin Dashboard | GitMastery Training</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Geist:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/tailwind-config.js"></script>
</head>
<body class="bg-background text-on-surface font-body-md" data-base="../">
<div id="header"></div>
<main class="pt-16">
<section class="py-20 px-margin-mobile md:px-margin-desktop">
<div class="max-w-container-max mx-auto">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome, <span id="welcome-name"></span></h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-12">Admin overview of everyone who has signed in.</p>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
<table class="w-full text-left">
<thead class="bg-surface-container-high">
<tr>
<th class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Name</th>
<th class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Email</th>
<th class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Role</th>
</tr>
</thead>
<tbody id="users-table-body">
</tbody>
</table>
</div>
</div>
</section>
</main>
<div id="footer"></div>
<script src="../js/config.js"></script>
<script type="module" src="../js/firebase.js"></script>
<script src="../js/common.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/dashboard-admin.js"></script>
</body></html>
