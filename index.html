<header>
    <h1>Welcome to GitHub Training from Web</h1>
    <p>Learn GitHub, DevOps, Cloud and Modern Technologies</p>
</header>

<div class="container">

    <h2 class="section-title">Available Training Programs</h2>

    <div id="training-list">
        <div class="loading">Loading training data...</div>
    </div>

</div>

<footer>
    © 2026 GitHub Training Portal
</footer>

<script>

    const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQovWmXKVQ2Uv-_uu2YDIL1XgcrddnFYklxgJNwJc9nPVWLsvNVWQSOYWH2ttGQXH0lxnV9ebMW3J7M/pub?output=csv";

    async function loadTrainingData() {

        try {

            const response = await fetch(SHEET_URL);
            const csvText = await response.text();

            const rows = csvText
                .trim()
                .split('\n')
                .map(row => row.split(','));

            const container = document.getElementById('training-list');

            container.innerHTML = '';

            rows.slice(1).forEach(row => {

                const title = row[0] || '';
                const desc = row[1] || '';
                const tech = row[2] || '';
                const link = row[3] || '#';

                container.innerHTML += `
                    <div class="card">
                        <h3>${title}</h3>

                        <p>${desc}</p>

                        <div class="tech">
                            ${tech}
                        </div>

                        <br>

                        <a
                            class="btn"
                            href="${link}"
                            target="_blank"
                        >
                            Open Training
                        </a>
                    </div>
                `;
            });

        } catch (error) {

            document.getElementById('training-list').innerHTML = `
                <div class="card">
                    <h3>Error Loading Data</h3>
                    <p>${error.message}</p>
                </div>
            `;

            console.error(error);
        }
    }

    loadTrainingData();

</script>
